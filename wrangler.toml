name = "canton-square-lofts-chatbot"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Comma-separated list of origins allowed to call /api/chat.
# Include both the apex and www variants of your Squarespace domain.
[vars]
ALLOWED_ORIGIN = "https://www.cantonsquarelofts.com,https://cantonsquarelofts.com"
MODEL = "claude-haiku-4-5-20251001"
TO_EMAIL = "info@cantonsquarelofts.com"
FROM_EMAIL = "Canton Square Lofts <bookings@cantonsquarelofts.com>"

# Secrets (never put these here) — set with:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put RESEND_API_KEY
